services:
  db:
    image: postgres:17-trixie
    restart: always
    volumes:
      - app-db-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
    ports:
      - "${POSTGRES_PORT?Variable not set}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    command: bash -c "scripts/prestart.sh && fastapi dev app/main.py --host 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      
volumes:
  app-db-data:

networks:
  net:
    name: app-network
    driver: bridge